    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<body>
    <!-- Header -->
    <header>
        <h1>Register Account</h1>
    </header>

    <!-- Navigation -->
    <div class="nav-container">
        <button id="navToggle"><span>☰</span></button>
        <nav id="mainNav">
            <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="bill.html">Bill Calculator</a></li>
            </ul>
        </nav>
    </div>

    <!-- Main Content -->
    <main>

        <!-- Registration Form -->
        <section class="register-form">
            <h2>Create Account</h2>

            <form method="POST" action="https://mercury.swin.edu.au/it000000/cos10005/regtest.php">

                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>

                <fieldset>
                    <legend>Gender</legend>

                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>
                </fieldset>

                <label for="diet">Dietary Preferences</label>
                <select id="diet" name="diet"></select>

                <label for="country">Country/Region</label>
                <select id="country" name="country">
                    <option value="">Select Country</option>
                    <option value="australia">Australia</option>
                    <option value="new_zealand">New Zealand</option>
                </select>

                <div class="button-row">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </div>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>&copy; 2026 Ruiyi Guo</footer>
</body>

</html>
