<!DOCTYPE html>
<html lang="en">

<head>
    <title>Assignment 2 - Reservations</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Restaurant page">
    <meta name="keywords" content="Assignment, restaurants, reservations, food">
    <meta name="author" content="Ruiyi Guo">

    <link rel="stylesheet" href="Design/css/style.css" type="text/css">
    <script src="Design/js/script.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header>
        <h1>Restaurant Reservation</h1>
    </header>

    <!-- Navigation -->
    <button id="navToggle">☰</button>

    <nav id="mainNav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="restaurants.html">Restaurants</a></li>
            <li><a href="recommend.html">Recommendations</a></li>
            <li><a href="reservation.html" class="active">Reservations</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="bill.html">Bill Calculator</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- Reservation Form -->
        <section class="reservation-form">
            <h2>Book a Table</h2>

            <form method="POST" action="https://mercury.swin.edu.au/it000000/cos10005/regtest.php">

                <label for="fname">Full Name</label>
                <input type="text" id="fname" name="fname" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="restaurant">Restaurant Selection</label>
                <select id="restaurant" name="restaurant"></select>

                <div class="datetime-row">

                    <div class="datetime-field">
                        <label for="date">Reservation Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="datetime-field">
                        <label for="time">Reservation Time</label>
                        <input type="time" id="time" name="time" required>
                    </div>

                </div>

                <label for="people">Number of People</label>
                <input type="number" id="people" name="people" min="1" value="1" required>

                <label for="requests">Special Requests</label>
                <textarea id="requests" name="requests" rows="4" cols="30"></textarea>

                <label for="deposit">Deposit Amount</label>
                <input type="text" id="deposit" name="deposit" value="$00" readonly>

                <fieldset>
                    <legend>Deposit Method</legend>

                    <label>
                        <input type="radio" name="payment" value="voucher" required>
                        Voucher
                    </label>

                    <label>
                        <input type="radio" name="payment" value="online" required>
                        Online Payment
                    </label>
                </fieldset>

                <!-- Voucher Section -->
                <div id="voucher-section">
                    <label for="voucher">Voucher Code</label>
                    <input type="text" id="voucher" name="voucher"
                        maxlength="12" pattern="[0-9]{12}">
                </div>

                <!-- Card Section -->
                <div id="card-section">
                    <label for="card">Credit Card Details</label>
                    <input type="text" id="card" name="card" pattern="[0-9]{15,16}">
                </div>

                <label for="billing-email">Billing Email Address</label>
                <input type="email" id="billing-email" name="billing-email">

                <label>
                    <input type="checkbox" id="same-email">
                    Same as email address
                </label>

                <input type="submit" value="Reserve Table">

            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>&copy; 2026 Ruiyi Guo</footer>
</body>

</html>
