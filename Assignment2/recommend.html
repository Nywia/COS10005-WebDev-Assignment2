<!DOCTYPE html>
<html lang="en">

<head>
    <title>Assignment 2 - Recommendations</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recommendations page">
    <meta name="keywords" content="Assignment, restaurants, reservations, food">
    <meta name="author" content="Ruiyi Guo">

    <link rel="stylesheet" href="Design/css/style.css" type="text/css">
    <script src="Design/js/script.js" defer></script>
</head>

<body>
    <!-- Header -->
    <header>
        <h1>Restaurant Recommendations</h1>
    </header>

    <!-- Navigation -->
    <button id="navToggle">☰</button>

    <nav id="mainNav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="restaurants.html">Restaurants</a></li>
            <li><a href="recommend.html" class="active">Recommendations</a></li>
            <li><a href="reservation.html">Reservations</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="bill.html">Bill Calculator</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- Recommendation Form -->
        <section class="recommendation-form">
            <h2>Find a Restaurant</h2>

            <form method="POST" action="https://mercury.swin.edu.au/it000000/cos10005/regtest.php">

                <label for="diet">Dietary Preference</label>
                <select id="diet" name="diet"></select>
                
                <label for="min-budget">Min Budget ($)</label>
                <input type="number" id="min-budget" name="min-budget" min="0" placeholder="No minimum">

                <label for="max-budget">Max Budget ($)</label>
                <input type="number" id="max-budget" name="max-budget" min="0" placeholder="No maximum">

                <label for="purpose">Dining Purpose</label>
                <select id="purpose" name="purpose"></select>

                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </form>
        </section>

        <!-- Recommendation Results -->
        <section class="recommendation-results">
            <div id="results"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer>&copy; 2026 Ruiyi Guo</footer>
</body>

</html>
